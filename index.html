<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multifocal Power Distribution</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:32px 20px;
  background:#f5f1e8;
  color:#333;
  font-family:Arial,sans-serif;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto
}

h1{
  margin:0 0 20px;
  font-size:22px;
  font-weight:500
}

.panel{
  background:#fffdf7;
  border:1px solid #ddd6c9;
  border-radius:10px;
  padding:16px;
  margin-bottom:12px;
}

.sectionTitle{
  margin:0 0 10px;
  font-size:10px;
  font-weight:600;
  letter-spacing:1.2px;
  color:#777;
}


.panelRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.inputs{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.control{
  display:flex;
  align-items:center;
  gap:7px;
}

.control label{
  font-size:11px;
  color:#666;
}

input,select{
  width:76px;
  height:34px;
  padding:6px 8px;
  border:1px solid #bbb4a8;
  border-radius:5px;
  background:#fff;
  color:#333;
  font-size:14px;
  text-align:center;
}

select{
  width:82px;
  cursor:pointer
}

.unit{
  font-size:12px;
  color:#777
}

.toggle{
  display:flex;
  gap:3px;
  padding:3px;
  background:#eee9df;
  border-radius:6px;
}

.toggle button{
  border:0;
  padding:6px 10px;
  border-radius:4px;
  background:transparent;
  color:#666;
  font-size:10px;
  cursor:pointer;
}

.toggle button.active{
  background:#fffdf7;
  color:#333;
  box-shadow:0 1px 2px rgba(0,0,0,.08);
}


/* EYE CONTROLS */

.eyeControls{
  display:flex;
  gap:18px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #e3ddd2;
}

.eyeControl{
  display:flex;
  align-items:center;
  gap:7px;
}

.eyeControl label{
  font-size:11px;
  color:#666;
}

.eyePointToggle{
  height:34px;
  padding:0 12px;
  border:1px solid #bbb4a8;
  border-radius:6px;
  background:#eee9df;
  color:#555;
  font-size:10px;
  cursor:pointer;
}

.eyePointToggle:hover{
  background:#e3ddd1;
}

.eyePointToggle:active{
  background:#d7d0c3;
}

.eyeButtons{
  display:flex;
  height:34px;
  border:1px solid #bbb4a8;
  border-radius:6px;
  overflow:hidden;
  background:#fff;
}

.eyeButtons button{
  width:34px;
  height:100%;
  border:0;
  background:#eee9df;
  color:#555;
  font-size:17px;
  line-height:1;
  cursor:pointer;
}

.eyeButtons button:hover{
  background:#e3ddd1;
}

.eyeButtons button:active{
  background:#d7d0c3;
}

.eyeValue{
  min-width:48px;
  text-align:center;
  font-size:12px;
  color:#555;
}


/* LENS HEADERS */

.lensTitles{
}

.lensTitle{
  text-align:center;
  font-size:12px;
  letter-spacing:1px;
  color:#555;
}

.design2Title{
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
}

.corridorSelect{
  width:102px;
  height:28px;
  font-size:12px;
  margin-left:10px;
}


/* GRAPHS */

.graphs{
  display:flex;
  justify-content:center;
  gap:0;
  position:relative;
}

#graphs{
  position:relative;
}

#graphs::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:474px;
  width:2px;
  border-left:4px dotted #888;
  background:none;
  z-index:30;
  pointer-events:none;
}

.graph{
  display:flex;
  align-items:flex-start;
  flex:0 0 auto;
}

.graph:nth-child(2){
  margin-left:calc(var(--plot-gap) * 1px);
}

.ruler{
  position:relative;
  width:50px;
  height:1200px
}

.plot{
  position:relative;
  width:680px;
  height:1200px;
  overflow:visible;
  background:#fffdf7;
  border:1px solid #aaa296;
  border-radius:3px;
}


/* MM RULER LABELS */

.mm{
  position:absolute;
  right:10px;
  transform:translateY(-50%);
  font-size:15px;
  color:#777
}

.tick{
  position:absolute;
  right:0;
  width:8px;
  height:1px;
  background:#777
}


/* HEAT */

.heat{
  position:absolute;
  left:0;
  width:100%;
  pointer-events:none
}

.heatClip{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.line{
  position:absolute;
  left:0;
  width:100%;
  height:2px;
  background:repeating-linear-gradient(
    to right,
    rgba(60,60,60,.48) 0 3px,
    transparent 3px 7px
  )
}

.label{
  position:absolute;
  left:calc(100% + 10px);
  transform:translateY(-50%);
  white-space:nowrap;
  font-size:15px;
  color:#555
}

.zoneLabel{
  position:absolute;
  left:25%;
  transform:translate(-50%,-50%);
  font-size:15px;
  letter-spacing:1px;
  color:#333;
  background:#fffdf7;
  padding:3px 6px;
  border-radius:3px;
  pointer-events:none
}


/* EXISTING MARKERS */

.cMarker{
  position:absolute;
  left:50%;
  width:100px;
  height:100px;
  transform:translate(-50%,-50%);
  border:2px solid #555;
  border-bottom-color:transparent;
  border-radius:50%;
  pointer-events:none
}

.crossMarker{
  position:absolute;
  left:50%;
  width:15px;
  height:15px;
  transform:translate(-50%,-50%);
  pointer-events:none
}

.crossMarker:before,
.crossMarker:after{
  content:"";
  position:absolute;
  background:#555
}

.crossMarker:before{
  left:50%;
  top:0;
  width:2px;
  height:100%;
  transform:translateX(-50%)
}

.crossMarker:after{
  left:0;
  top:50%;
  width:100%;
  height:2px;
  transform:translateY(-50%)
}

.completeCircle{
  position:absolute;
  left:50%;
  width:96px;
  height:96px;
  transform:translate(-50%,-50%);
  border:2px solid #555;
  border-radius:50%;
  pointer-events:none
}

.circleConnect{
  position:absolute;
  height:2px;
  background:#555;
  transform-origin:left center;
  pointer-events:none;
}


/* EYE POINT */

.eyeMarker{
  position:absolute;
  left:50%;
  width:75px;
  height:75px;
  transform:translate(-50%,-50%);
  border:6px solid rgba(185,74,58,0.7);
  border-radius:50%;
  pointer-events:none;
}


/* STEPPERS */

.stepper{
  display:flex;
  align-items:center;
  height:34px;
  border:1px solid #bbb4a8;
  border-radius:6px;
  overflow:hidden;
  background:#fff
}

.stepper button{
  width:30px;
  height:100%;
  border:0;
  background:#eee9df;
  color:#555;
  font-size:17px;
  line-height:1;
  cursor:pointer;
  transition:.15s
}

.stepper button:hover{
  background:#e3ddd1
}

.stepper button:active{
  background:#d7d0c3
}

.stepper input{
  width:58px;
  height:32px;
  border:0;
  border-left:1px solid #ddd6c9;
  border-right:1px solid #ddd6c9;
  border-radius:0;
  background:#fff;
  outline:none;
}

.stepper input:focus{
  background:#fffdf7
}

.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0
}

.stepper input[type=number]{
  -moz-appearance:textfield;
}


/* RANGE */

input[type="range"]{
  width:180px;
  height:6px;
  padding:0;
  border:0;
  background:transparent;
  cursor:pointer;
}

input[type="range"]::-webkit-slider-runnable-track{
  height:4px;
  background:#d8d1c5;
  border-radius:4px;
}

input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:16px;
  height:16px;
  margin-top:-6px;
  border-radius:50%;
  background:#527a64;
  border:2px solid #fffdf7;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}

input[type="range"]::-moz-range-track{
  height:4px;
  background:#d8d1c5;
  border-radius:4px;
}

input[type="range"]::-moz-range-thumb{
  width:16px;
  height:16px;
  border-radius:50%;
  background:#527a64;
  border:2px solid #fffdf7;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}

.sliderValue{
  min-width:55px;
  font-size:12px;
  color:#555;
  text-align:center;
}


</style>
</head>

<body>

<h1>Multifocal Power Distribution</h1>

<div class="app">

<!-- TWO LENSES -->

<div
  style="margin-top:-150px; margin-bottom:-180px"
  class="graphs"
  id="graphs"
>

  <div class="graph">
    <div id="ruler1" class="ruler"></div>
    <div id="plot1" class="plot"></div>
  </div>

  <div class="graph">
    <div id="ruler2" class="ruler"></div>
    <div id="plot2" class="plot"></div>
  </div>

</div>

</div>





<!-- LENS TITLES -->

<div
  style="
    margin-top:20px;
    margin-bottom:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px
  "
  class="lensTitles"
>

  <div
    class="toggle"
    style="width:max-content;margin:0"
  >

    <button
      id="officeLensMode"
      class="active"
      type="button"
    >
      <span class="lensTitle">
        OFFICE LENS CORRIDOR 18 MM
      </span>
    </button>

    <button
      id="palLensMode"
      type="button"
    >
      <span class="lensTitle">
        PAL LENS
      </span>

      <span id="corridorControl">

        <span
          style="margin-left:5px"
          class="lensTitle"
        >
          CORRIDOR
        </span>

        <input
          style="width:170px"
          type="range"
          id="corridor"
          class="corridorSlider"
          min="9"
          max="15"
          step="2"
          value="11"
          oninput="updateCorridor(this.value)"
        >

        <span
          class="lensTitle"
          id="corridorValue"
        >
          11 MM
        </span>

      </span>

    </button>

  </div>

</div>

<!-- PANEL 1 -->

<div style="display:none" class="panel">

  <div class="control">

    <label>SCALE</label>

    <input
      id="scaleSlider"
      type="range"
      min="50"
      max="60"
      step="0.1"
      value="55.5"
      oninput="pageScale=this.value/100;applyScale()"
    >

  </div>

</div>


<div class="panel">

  <div class="sectionTitle">
    PRESCRIPTION & DISPLAY
  </div>

  <div class="panelRow">

    <div class="inputs">

      <div class="control">

        <label for="far">
          FAR RX
        </label>

        <input
          style="width:500px"
          id="far"
          type="range"
          min="-10"
          max="6"
          step="0.25"
          value="-2"
          oninput="
            this.nextElementSibling.textContent=
            parseFloat(this.value).toFixed(2)+' D';
            this.dispatchEvent(new Event('change'))
          "
        >

        <span class="sliderValue">
          -2.00 D
        </span>

      </div>


      <div class="control">

        <label for="add">
          ADD
        </label>

        <input
          id="add"
          type="range"
          min="0.5"
          max="4"
          step="0.25"
          value="2"
          oninput="
            this.nextElementSibling.textContent=
            parseFloat(this.value).toFixed(2)+' D';
            this.dispatchEvent(new Event('change'))
          "
        >

        <span class="sliderValue">
          2.00 D
        </span>

      </div>

    </div>


    <div class="toggle">

      <button id="addMode" class="active">
        ADD
      </button>

      <button id="finalMode">
        FINAL
      </button>

    </div>

  </div>


<!-- EYE POINT CONTROL -->

<div class="eyeControls">

  <div class="eyeControl">

    <label>
      EYE POINT HEIGHT
    </label>

    <input
      type="range"
      id="fittingHeight"
      min="16"
      max="36"
      step="1"
      value="26"
    >

    <span
      id="fittingHeightValue"
      class="eyeValue"
    >
      26 MM
    </span>


    <label>
      FITTING POSITION
    </label>

    <input
      id="eyePointSlider"
      type="range"
      min="10"
      max="30"
      step="1"
      value="20"
      oninput="
        eyePoint=parseInt(this.value);
        updateEyeControls();
        draw();
      "
    >

    <span
      id="eyePointValue"
      class="eyeValue"
    >
      20 MM
    </span>


    <div class="eyeControl">

      <label>
        NOSEPAD POSITION
      </label>

      <input
        id="nosepadSlider"
        type="range"
        min="2"
        max="12"
        step="1"
        value="7"
        oninput="
          nosepadPosition=parseFloat(this.value);
          updateNosepadControl();
          draw();
        "
      >

      <span
        id="nosepadValue"
        class="eyeValue"
      >
        7 MM
      </span>

    </div>

  </div>

</div>


<div class="eyeControls">

  <div class="eyeControl">

    <label>
      FITTING HEIGHT FOR EDGING
    </label>

    <span
      id="netFittingHeightValue"
      class="eyeValue"
    >
      10 MM
    </span>


  <button
    type="button"
    onclick="toggleEyePoint()"
    id="eyePointToggle"
    class="eyePointToggle"
  >
    EYE POINT: ON
  </button>



<label>
  PUPIL DISTANCE
</label>

<input
  type="range"
  id="plotGap"
  min="56"
  max="74"
  step="1"
  value="70"
>

<span class="eyeValue" id="plotGapValue">
  71 MM
</span>



  </div>

</div>

</div>

<script>

function updateCorridor(value){

  document.getElementById("corridorValue")
    .textContent=value+" MM";

  draw();

}


/* =========================================================
   PLOT GAP
========================================================= */

const plotGapInput=
  document.getElementById("plotGap");

const graphs=
  document.getElementById("graphs");

const plotGapValue=
  document.getElementById("plotGapValue");


function updatePlotGap(){

  const mm=
    parseInt(plotGapInput.value)||0;

  const gap=
    120+(mm-70)*18;

  graphs.style.setProperty(
    "--plot-gap",
    gap
  );

  plotGapValue.textContent=
    mm+" MM";

}

plotGapInput.addEventListener(
  "input",
  updatePlotGap
);

updatePlotGap();

</script>




</div>


<!-- PANEL 2 -->

<div class="panel">

  <div class="sectionTitle">
    HEAT MAP & LENS DESIGN
  </div>

  <div class="panelRow">

    <div class="inputs">

      <div class="control">

        <label for="selectedAdd">
          HEATMAP MAX ADD
        </label>

        <input
          id="selectedAdd"
          type="range"
          min="0.25"
          max="4"
          step="0.25"
          value="2"
          oninput="
            this.nextElementSibling.textContent=
            parseFloat(this.value).toFixed(2)+' D';
            this.dispatchEvent(new Event('change'))
          "
        >

        <span class="sliderValue">
          2.00 D
        </span>

      </div>

    </div>


    <div class="toggle">

      <button id="relativeMode">
        RELATIVE
      </button>

      <button id="selectedMode" class="active">
        SELECTED
      </button>

    </div>

  </div>

</div>


<script>

let fittingHeight=26;


function addFittingHeightLine(plot){

  if(!eyePointVisible)
    return;

  const line=
    document.createElement("div");

  line.style.position="absolute";
  line.style.left="0";
  line.style.width="100%";
  line.style.height="6px";

  line.style.top=
    (y(16)+(fittingHeight/HEIGHT*100))+"%";

  line.style.transform=
    "translateY(-50%)";

  line.style.background=
    "repeating-linear-gradient(to right,rgba(185,74,58,0.7) 0 4px,transparent 4px 12px)";

  line.style.pointerEvents="none";
  line.style.zIndex="18";

  plot.appendChild(line);

}


function setLensMode(mode){

  lensMode=mode;

  const office=
    document.getElementById("officeLensMode");

  const pal=
    document.getElementById("palLensMode");

  if(mode==="office"){

    office.classList.add("active");
    pal.classList.remove("active");

  }else{

    pal.classList.add("active");
    office.classList.remove("active");

  }

  draw();

}


document.getElementById("officeLensMode")
  .onclick=function(){

    setLensMode("office");

  };


document.getElementById("palLensMode")
  .onclick=function(){

    setLensMode("pal");

  };


/* =========================================================
   BASIC STEPPER
========================================================= */

function stepInput(id,step){

  const input=
    document.getElementById(id);

  let value=
    parseFloat(input.value)||0;

  value=
    Math.round((value+step)*100)/100;

  if(input.min!=="")
    value=
      Math.max(
        parseFloat(input.min),
        value
      );

  input.value=
    value.toFixed(2);

  input.dispatchEvent(
    new Event("input",{bubbles:true})
  );

}


/* =========================================================
   EYE POINT
========================================================= */

let eyePoint=20;

let eyePointVisible=true;

let nosepadPosition=7;


function toggleEyePoint(){

  eyePointVisible=!eyePointVisible;

  document.getElementById("eyePointToggle")
    .textContent=
      "EYE POINT: "+
      (eyePointVisible?"ON":"OFF");

  draw();

}


function moveEyePoint(amount){

  eyePoint+=amount;

  eyePoint=
    Math.max(
      0,
      Math.min(50,eyePoint)
    );

  updateEyeControls();

  draw();

}


function updateEyeControls(){

  const crossPosition=20;

  const span=
    eyePoint-crossPosition;

  document.getElementById("eyePointValue")
    .textContent=
      span.toFixed(0)+" MM";

  updateNetFittingHeight();

}


function addNosepad(plot,plotIndex){

  if(!eyePointVisible)
    return;

  const oval=
    document.createElement("div");

  oval.style.position="absolute";

  oval.style.width=
    (4/100*plot.clientHeight)+"px";

  oval.style.height=
    (8/100*plot.clientHeight)+"px";

  const redCircleMM=16;

  const nosepadMM=
    redCircleMM+nosepadPosition;

  const nasalOffset=
    plotIndex===0 ? 20 : -20;

  oval.style.left=
    `calc(50% + ${nasalOffset}%)`;

  oval.style.top=
    y(nosepadMM)+"%";

  oval.style.transform=
    "translate(-50%,-50%)";

  oval.style.border=
    "6px solid rgba(185,74,58,0.7)";

  oval.style.borderRadius="50%";

  oval.style.pointerEvents="none";

  oval.style.zIndex="25";

  plot.appendChild(oval);

}


function updateNosepadControl(){

  document.getElementById("nosepadValue")
    .textContent=
      Math.abs(nosepadPosition)
      .toFixed(0)+" MM";

}


function updateNetFittingHeight(){

  const eyePoint=
    parseFloat(
      document.getElementById("eyePointValue").textContent
    )||0;

  const fittingPosition=
    parseFloat(
      document.getElementById("fittingHeightValue").textContent
    )||0;

  const net=
    eyePoint+fittingPosition;

  document.getElementById("netFittingHeightValue")
    .textContent=
      net.toFixed(0)+" MM";

}


/* =========================================================
   INPUTS
========================================================= */

const farInput=
  document.getElementById("far");

const addInput=
  document.getElementById("add");

const selectedAddInput=
  document.getElementById("selectedAdd");

const corridorInput=
  document.getElementById("corridor");


const addMode=
  document.getElementById("addMode");

const finalMode=
  document.getElementById("finalMode");


const relativeMode=
  document.getElementById("relativeMode");

const selectedMode=
  document.getElementById("selectedMode");


const plots=[

  document.getElementById("plot1"),

  document.getElementById("plot2")

];


const rulers=[

  document.getElementById("ruler1"),

  document.getElementById("ruler2")

];


let mode="add";

let heatMode="selected";

let lensMode="office";


const HEIGHT=100;

const OFFSET=25;


function y(mm){

  return (mm+OFFSET)/HEIGHT*100;

}


function h(mm){

  return mm/HEIGHT*100;

}


/* =========================================================
   LENS POSITION
========================================================= */

function lensY(mm){

  return y(
    mm-eyePoint+16
  );

}


/* =========================================================
   DESIGN 1
========================================================= */

function percent1(mm){

  if(mm<=10)
    return 0;

  if(mm<=20)
    return (mm-10)/10*12;

  if(mm<=38)
    return 12+(mm-20)/18*88;

  return 100;

}


function mmAtPercent1(p){

  if(p<=12)
    return 10+(p/12)*10;

  return 20+((p-12)/88)*18;

}


/* =========================================================
   DESIGN 2
========================================================= */

function percent2(mm,corridor){

  const start=20;

  const end=
    start+corridor;

  if(mm<=start)
    return 0;

  if(mm<=end)
    return (mm-start)/corridor*100;

  return 100;

}


function mmAtPercent2(p,corridor){

  return 20+(p/100)*corridor;

}


/* =========================================================
   FORMAT POWER
========================================================= */

function formatPower(v){

  const n=
    Math.round(v*100)/100;

  return (n>0?"+":"")+
    n.toFixed(2)+" D";

}


/* =========================================================
   HEAT COLOUR
========================================================= */

function heatColor(power,reference){

  if(power<=0)
    return "#fffdf7";

  const t=
    Math.max(
      0,
      Math.min(
        1,
        reference>0
          ?power/reference
          :0
      )
    );


  const stops=[

    {p:0.00,c:[255,253,247]},

    {p:0.15,c:[250,248,225]},

    {p:0.30,c:[246,241,198]},

    {p:0.45,c:[232,231,180]},

    {p:0.60,c:[211,222,177]},

    {p:0.75,c:[190,210,174]},

    {p:0.88,c:[173,201,169]},

    {p:1.00,c:[158,193,165]}

  ];


  let lower=
    stops[0];

  let upper=
    stops[stops.length-1];


  for(
    let i=0;
    i<stops.length-1;
    i++
  ){

    if(
      t>=stops[i].p &&
      t<=stops[i+1].p
    ){

      lower=
        stops[i];

      upper=
        stops[i+1];

      break;

    }

  }


  const range=
    upper.p-lower.p;


  const localT=
    range>0
      ?(t-lower.p)/range
      :0;


  const r=
    Math.round(
      lower.c[0]+
      (upper.c[0]-lower.c[0])*localT
    );


  const g=
    Math.round(
      lower.c[1]+
      (upper.c[1]-lower.c[1])*localT
    );


  const b=
    Math.round(
      lower.c[2]+
      (upper.c[2]-lower.c[2])*localT
    );


  return `rgb(${r},${g},${b})`;

}


/* =========================================================
   DARKEN
========================================================= */

function darkenColor(color,amount=.25){

  const match=
    color.match(/\d+/g);

  if(!match)
    return color;


  const r=
    parseInt(match[0]);

  const g=
    parseInt(match[1]);

  const b=
    parseInt(match[2]);


  return `rgb(
    ${Math.round(r*(1-amount))},
    ${Math.round(g*(1-amount))},
    ${Math.round(b*(1-amount))}
  )`;

}


/* =========================================================
   DESIGN 1 HEAT
========================================================= */

function drawHeat1(plot,add){

  const heatClip=
    document.createElement("div");

  heatClip.className="heatClip";

  plot.appendChild(heatClip);


  const reference=
    heatMode==="relative"
      ?add
      :Math.max(
          .25,
          (parseFloat(selectedAddInput.value)||.25)+.25
        );


  let mm=0;


  while(mm<75){

    let regionPower=0;

    let regionColor=null;

    let next=mm+.25;


    if(mm<10){

      regionPower=0;

      next=10;


    }else if(mm<38){

      const currentPower=
        add*
        percent1(mm)/
        100;


      const nextPower=
        Math.floor(
          currentPower/.25+1e-9
        )*.25+.25;


      if(nextPower<=add){

        const boundary=
          mmAtPercent1(
            nextPower/add*100
          );


        if(
          boundary>mm &&
          boundary<38
        )
          next=boundary;


        regionPower=
          nextPower;


      }else{

        regionPower=add;

        next=38;

      }


    }else{

      const topPower=
        Math.min(
          reference,
          Math.floor(add/.25)*.25+.25
        );


      const topColor=
        heatColor(
          topPower,
          reference
        );


      regionColor=
        darkenColor(
          topColor,
          .0
        );


      next=100;

    }


    const slice=
      document.createElement("div");

    slice.className="heat";


    slice.style.top=
      lensY(mm)+"%";


    slice.style.height=
      h(next-mm)+.2+"%";


    if(regionColor!==null){

      slice.style.background=
        regionColor;

    }else{

      slice.style.background=
        heatColor(
          regionPower,
          reference
        );

    }


    heatClip.appendChild(slice);

    mm=next;

  }

}

/* =========================================================
   COMPLETE CIRCLE CONNECTION
========================================================= */

function addCompleteCircleConnection(
  plot,
  circleMM,
  crossMM
){

  const line=
    document.createElement("div");

  line.className="circleConnect";


  const circleX=
    50+circleOffsetX();

  const circleY=
    lensY(circleMM);


  const crossX=50;

  const crossY=
    lensY(crossMM);


  const dx=
    (crossX-circleX)*
    plot.clientWidth/
    100;

  const dy=
    (crossY-circleY)*
    plot.clientHeight/
    100;


  const length=
    Math.sqrt(
      dx*dx+
      dy*dy
    );


  const angle=
    Math.atan2(dy,dx)*
    180/Math.PI;


  line.style.left=
    circleX+"%";

  line.style.top=
    circleY+"%";

  line.style.width=
    length+"px";

  line.style.transform=
    `rotate(${angle}deg)`;


  plot.appendChild(line);

}

/* =========================================================
   RULER
========================================================= */

function drawRuler(ruler,showLabels){

  ruler.innerHTML="";


  for(
    let mm=20;
    mm<=80;
    mm++
  ){

    const tick=
      document.createElement("div");

    tick.className="tick";

    tick.style.top=
      mm+"%";


    if(mm%5===0)
      tick.style.width="15px";


    ruler.appendChild(tick);


    /*
       MM LABELS:
       Only show on the LEFT ruler.

       Right ruler has ticks only.
    */

    if(
      mm%5===0 &&
      showLabels
    ){

      const label=
        document.createElement("div");

      label.className="mm";

      label.style.top=
        mm+"%";

      label.textContent=
        mm;

      ruler.appendChild(label);

    }

  }

}

    );


  const corridor=
    parseInt(

      far,
      add,

    drawDesign1(
      far,
      add,
      1
    );

      far,
      add,
      corridor,
      0
    );

    drawDesign2(
      far,
      add,
      corridor,
      1
    );

}
