<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multifocal Power Distribution</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:32px 20px;
  background:#f5f1e8;
  color:#333;
  font-family:Arial,sans-serif;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto
}

h1{
  margin:0 0 20px;
  font-size:22px;
  font-weight:500
}

.panel{
  background:#fffdf7;
  border:1px solid #ddd6c9;
  border-radius:10px;
  padding:16px;
  margin-bottom:12px;
}

.sectionTitle{
  margin:0 0 10px;
  font-size:10px;
  font-weight:600;
  letter-spacing:1.2px;
  color:#777;
}

.panelRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.inputs{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.control{
  display:flex;
  align-items:center;
  gap:7px;
}

.control label{
  font-size:11px;
  color:#666;
}

input,select{
  width:76px;
  height:34px;
  padding:6px 8px;
  border:1px solid #bbb4a8;
  border-radius:5px;
  background:#fff;
  color:#333;
  font-size:14px;
  text-align:center;
}

select{
  width:82px;
  cursor:pointer
}

.unit{
  font-size:12px;
  color:#777
}

.toggle{
  display:flex;
  gap:3px;
  padding:3px;
  background:#eee9df;
  border-radius:6px;
}

.toggle button{
  border:0;
  padding:6px 10px;
  border-radius:4px;
  background:transparent;
  color:#666;
  font-size:10px;
  cursor:pointer;
}

.toggle button.active{
  background:#fffdf7;
  color:#333;
  box-shadow:0 1px 2px rgba(0,0,0,.08);
}


/* EYE CONTROLS */

.eyeControls{
  display:flex;
  gap:18px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #e3ddd2;
}

.eyeControl{
  display:flex;
  align-items:center;
  gap:7px;
}

.eyeControl label{
  font-size:11px;
  color:#666;
}

.eyePointToggle{
  height:34px;
  padding:0 12px;
  border:1px solid #bbb4a8;
  border-radius:6px;
  background:#eee9df;
  color:#555;
  font-size:10px;
  cursor:pointer;
}

.eyePointToggle:hover{
  background:#e3ddd1;
}

.eyePointToggle:active{
  background:#d7d0c3;
}

.eyeButtons{
  display:flex;
  height:34px;
  border:1px solid #bbb4a8;
  border-radius:6px;
  overflow:hidden;
  background:#fff;
}

.eyeButtons button{
  width:34px;
  height:100%;
  border:0;
  background:#eee9df;
  color:#555;
  font-size:17px;
  line-height:1;
  cursor:pointer;
}

.eyeButtons button:hover{
  background:#e3ddd1;
}

.eyeButtons button:active{
  background:#d7d0c3;
}

.eyeValue{
  min-width:48px;
  text-align:center;
  font-size:12px;
  color:#555;
}


/* LENS HEADERS */

.lensTitles{
}

.lensTitle{
  text-align:center;
  font-size:12px;
  letter-spacing:1px;
  color:#555;
}

.design2Title{
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
}

.corridorSelect{
  width:102px;
  height:28px;
  font-size:12px;
  margin-left:10px;
}


/* GRAPHS */

.graphs{
  display:flex;
  justify-content:center;
  gap:120px;
}

.graph{
  display:flex;
  align-items:flex-start
}

.ruler{
  position:relative;
  width:50px;
  height:1200px
}

.mm{
  position:absolute;
  right:10px;
  transform:translateY(-50%);
  font-size:15px;
  color:#777
}

.tick{
  position:absolute;
  right:0;
  width:8px;
  height:1px;
  background:#777
}

.plot{
  position:relative;
  width:720px;
  height:1200px;
  overflow:visible;
  background:#fffdf7;
  border:1px solid #aaa296;
  border-radius:3px;
}

.heat{
  position:absolute;
  left:0;
  width:100%;
  pointer-events:none
}

.heatClip{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.line{
  position:absolute;
  left:0;
  width:100%;
  height:1px;
  background:repeating-linear-gradient(
    to right,
    rgba(60,60,60,.35) 0 2px,
    transparent 2px 7px
  )
}

.label{
  position:absolute;
  left:calc(100% + 10px);
  transform:translateY(-50%);
  white-space:nowrap;
  font-size:15px;
  color:#555
}

.zoneLabel{
  position:absolute;
  left:35%;
  transform:translate(-50%,-50%);
  font-size:15px;
  letter-spacing:1px;
  color:#333;
  background:#fffdf7;
  padding:3px 6px;
  border-radius:3px;
  pointer-events:none
}


/* EXISTING MARKERS */

.cMarker{
  position:absolute;
  left:50%;
  width:100px;
  height:100px;
  transform:translate(-50%,-50%);
  border:2px solid #555;
  border-bottom-color:transparent;
  border-radius:50%;
  pointer-events:none
}

.crossMarker{
  position:absolute;
  left:50%;
  width:15px;
  height:15px;
  transform:translate(-50%,-50%);
  pointer-events:none
}

.crossMarker:before,
.crossMarker:after{
  content:"";
  position:absolute;
  background:#555
}

.crossMarker:before{
  left:50%;
  top:0;
  width:2px;
  height:100%;
  transform:translateX(-50%)
}

.crossMarker:after{
  left:0;
  top:50%;
  width:100%;
  height:2px;
  transform:translateY(-50%)
}

.completeCircle{
  position:absolute;
  left:50%;
  width:100px;
  height:100px;
  transform:translate(-50%,-50%);
  border:2px solid #555;
  border-radius:50%;
  pointer-events:none
}


/* EYE POINT */

.eyeMarker{
  position:absolute;
  left:50%;
  width:75px;
  height:75px;
  transform:translate(-50%,-50%);
  border:6px solid rgba(185,74,58,0.7);
  border-radius:50%;
  pointer-events:none;
}


/* STEPPERS */

.stepper{
  display:flex;
  align-items:center;
  height:34px;
  border:1px solid #bbb4a8;
  border-radius:6px;
  overflow:hidden;
  background:#fff
}

.stepper button{
  width:30px;
  height:100%;
  border:0;
  background:#eee9df;
  color:#555;
  font-size:17px;
  line-height:1;
  cursor:pointer;
  transition:.15s
}

.stepper button:hover{
  background:#e3ddd1
}

.stepper button:active{
  background:#d7d0c3
}

.stepper input{
  width:58px;
  height:32px;
  border:0;
  border-left:1px solid #ddd6c9;
  border-right:1px solid #ddd6c9;
  border-radius:0;
  background:#fff;
  outline:none;
}

.stepper input:focus{
  background:#fffdf7
}

.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0
}

.stepper input[type=number]{
  -moz-appearance:textfield
}



input[type="range"]{
  width:180px;
  height:6px;
  padding:0;
  border:0;
  background:transparent;
  cursor:pointer;
}

input[type="range"]::-webkit-slider-runnable-track{
  height:4px;
  background:#d8d1c5;
  border-radius:4px;
}

input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:16px;
  height:16px;
  margin-top:-6px;
  border-radius:50%;
  background:#527a64;
  border:2px solid #fffdf7;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}

input[type="range"]::-moz-range-track{
  height:4px;
  background:#d8d1c5;
  border-radius:4px;
}

input[type="range"]::-moz-range-thumb{
  width:16px;
  height:16px;
  border-radius:50%;
  background:#527a64;
  border:2px solid #fffdf7;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}

.sliderValue{
  min-width:55px;
  font-size:12px;
  color:#555;
  text-align:center;
}

</style>
</head>

<body>






<h1>Multifocal Power Distribution</h1>



<!-- LENS TITLES -->






<div class="app">


<!-- TWO LENSES -->

<div style="margin-top:-250px; margin-bottom:-250px" class="graphs">
  <div class="graph">
    <div id="ruler1" class="ruler"></div>
    <div id="plot1" class="plot"></div>
  </div>


  <div class="graph">
    <div id="ruler2" class="ruler"></div>

    <div id="plot2" class="plot"></div>
  </div>
</div>


</div>
<div style="margin-bottom:20px" class="lensTitles">

  <span style="margin-left:280px" class="lensTitle">
    OFFICE LENS 
</span>


  <span style="margin-left:200px" class="lensTitle">

   PAL LENS 
    <select id="corridor" class="corridorSelect">

      <option value="9">9 MM</option>
      <option value="11" selected>11 MM</option>
      <option value="13">13 MM</option>
      <option value="15">15 MM</option>

    </select>

</span>

</div>













<!-- PANEL 1 -->


<div style="display:none" class="panel">

  <div class="control">
    <label>SCALE</label>

    <input
      id="scaleSlider"
      type="range"
      min="50"
      max="60"
      step="0.1"
      value="55.5"
      oninput="pageScale=this.value/100;applyScale()"
    >

  </div>

</div>


<div class="panel">

  <div class="sectionTitle">PRESCRIPTION & DISPLAY</div>

  <div class="panelRow">

    <div class="inputs">

      <div class="control">
        <label for="far">FAR RX</label>

        <input
          id="far"
          type="range"
          min="-10"
          max="6"
          step="0.25"
          value="-2"
          oninput="
            this.nextElementSibling.textContent=
            parseFloat(this.value).toFixed(2)+' D';
            this.dispatchEvent(new Event('change'))
          "
        >

        <span class="sliderValue">-2.00 D</span>
      </div>


      <div class="control">
        <label for="add">ADD</label>

        <input
          id="add"
          type="range"
          min="0.25"
          max="4"
          step="0.25"
          value="2"
          oninput="
            this.nextElementSibling.textContent=
            parseFloat(this.value).toFixed(2)+' D';
            this.dispatchEvent(new Event('change'))
          "
        >

        <span class="sliderValue">2.00 D</span>
      </div>

    </div>


    <div class="toggle">

      <button id="addMode" class="active">
        ADD
      </button>

      <button id="finalMode">
        FINAL
      </button>

    </div>

  </div>


  <!-- EYE POINT CONTROL -->

  <div class="eyeControls">

    <div class="eyeControl">

      <label>FITTING POSITION</label>

      <input
        id="eyePointSlider"
        type="range"
        min="0"
        max="32"
        step="1"
        value="20"
        oninput="
          eyePoint=parseInt(this.value);
          updateEyeControls();
          draw();
        "
      >

      <span id="eyePointValue" class="eyeValue">
        20 MM
      </span>

      <button
        type="button"
        onclick="toggleEyePoint()"
        id="eyePointToggle"
        class="eyePointToggle"
      >
        EYE POINT: ON
      </button>

    </div>

  </div>

</div>


<!-- PANEL 2 -->

<div class="panel">

  <div class="sectionTitle">
    HEAT MAP & LENS DESIGN
  </div>

  <div class="panelRow">

    <div class="inputs">

      <div class="control">

        <label for="selectedAdd">
          HEATMAP MAX ADD
        </label>

        <input
          id="selectedAdd"
          type="range"
          min="0.25"
          max="5"
          step="0.25"
          value="3"
          oninput="
            this.nextElementSibling.textContent=
            parseFloat(this.value).toFixed(2)+' D';
            this.dispatchEvent(new Event('change'))
          "
        >

        <span class="sliderValue">
          3.00 D
        </span>

      </div>

    </div>


    <div class="toggle">

      <button id="relativeMode">
        RELATIVE
      </button>

      <button id="selectedMode" class="active">
        SELECTED
      </button>

    </div>

  </div>

</div>





















<script>


/* =========================================================
   BASIC STEPPER
========================================================= */

function stepInput(id,step){

  const input=document.getElementById(id);

  let value=parseFloat(input.value)||0;

  value=Math.round((value+step)*100)/100;

  if(input.min!=="")
    value=Math.max(parseFloat(input.min),value);

  input.value=value.toFixed(2);

  input.dispatchEvent(
    new Event("input",{bubbles:true})
  );
}


/* =========================================================
   EYE POINT
========================================================= */

/*
   Eye Point is measured in mm from the top
   of the 50 mm lens.

   Starting position:
   Eye Point = 16 mm

   The eye marker itself stays FIXED.

   The lens design moves relative to it.
*/

let eyePoint=20;

let eyePointVisible=true;


/*
   Eye Point:
   -1 = up 1 mm
   +1 = down 1 mm
*/


function toggleEyePoint(){

  eyePointVisible=!eyePointVisible;

  document.getElementById("eyePointToggle")
    .textContent=
      "EYE POINT: "+
      (eyePointVisible?"ON":"OFF");

  draw();

}


function moveEyePoint(amount){

  eyePoint+=amount;

  /*
     Keep the eye point inside the lens.
  */

  eyePoint=Math.max(
    0,
    Math.min(50,eyePoint)
  );

  updateEyeControls();

  draw();

}


function updateEyeControls(){

  const crossPosition=20;

  const span=
    crossPosition-eyePoint;

  document.getElementById("eyePointValue")
    .textContent=
      span.toFixed(0)+" MM";

}


/* =========================================================
   INPUTS
========================================================= */

const farInput=
  document.getElementById("far");

const addInput=
  document.getElementById("add");

const selectedAddInput=
  document.getElementById("selectedAdd");

const corridorInput=
  document.getElementById("corridor");


const addMode=
  document.getElementById("addMode");

const finalMode=
  document.getElementById("finalMode");


const relativeMode=
  document.getElementById("relativeMode");

const selectedMode=
  document.getElementById("selectedMode");


const plots=[

  document.getElementById("plot1"),

  document.getElementById("plot2")

];


const rulers=[

  document.getElementById("ruler1"),

  document.getElementById("ruler2")

];

let mode="add";

let heatMode="selected";


const HEIGHT=100;
const OFFSET=25;

function y(mm){
  return (mm+OFFSET)/HEIGHT*100;
}

function h(mm){
  return mm/HEIGHT*100;
}


/* =========================================================
   LENS POSITION
========================================================= */

/*
   The eye marker is permanently fixed at
   the original 16 mm position.

   When Eye Point changes, the entire lens
   design moves in the opposite direction.

   Eye Point 16 mm = original position
   Eye Point 20 mm = lens moves up 4 mm
   Eye Point 12 mm = lens moves down 4 mm
*/

function lensY(mm){

  return y(
    mm-eyePoint+16
  );

}


/* =========================================================
   DESIGN 1
========================================================= */

/*
   10 mm = 0%
   20 mm = 12%
   38 mm = 100%
*/

function percent1(mm){

  if(mm<=10)
    return 0;

  if(mm<=20)
    return (mm-10)/10*12;

  if(mm<=38)
    return 12+(mm-20)/18*88;

  return 100;
}


function mmAtPercent1(p){

  if(p<=12)
    return 10+(p/12)*10;

  return 20+((p-12)/88)*18;

}


/* =========================================================
   DESIGN 2
========================================================= */

function percent2(mm,corridor){

  const start=20;

  const end=start+corridor;

  if(mm<=start)
    return 0;

  if(mm<=end)
    return (mm-start)/corridor*100;

  return 100;
}


function mmAtPercent2(p,corridor){

  return 20+(p/100)*corridor;

}


/* =========================================================
   FORMAT POWER
========================================================= */

function formatPower(v){

  const n=Math.round(v*100)/100;

  return (n>0?"+":"")+n.toFixed(2)+" D";

}


/* =========================================================
   HEAT COLOUR
========================================================= */

function heatColor(power,reference){

  if(power<=0)
    return "#fffdf7";


  const t=Math.max(
    0,
    Math.min(
      1,
      reference>0 ? power/reference : 0
    )
  );


  const steps=Math.max(
    1,
    Math.min(
      12,
      Math.round(t*12)
    )
  );


const colors=[

  [252,242,231],
  [250,235,218],
  [248,228,205],
  [246,221,192],
  [244,214,179],
  [242,207,166],
  [240,200,153],
  [238,193,140],
  [236,186,127],
  [234,179,114],
  [232,172,101],
  [230,165,88],
  [228,158,75],
  [226,151,62],
  [224,144,49]

];

  const c=colors[steps-1];


  return `rgb(${c[0]},${c[1]},${c[2]})`;

}


/* =========================================================
   DARKEN
========================================================= */

function darkenColor(color,amount=.25){

  const match=color.match(/\d+/g);

  if(!match)
    return color;


  const r=parseInt(match[0]);

  const g=parseInt(match[1]);

  const b=parseInt(match[2]);


  return `rgb(
    ${Math.round(r*(1-amount))},
    ${Math.round(g*(1-amount))},
    ${Math.round(b*(1-amount))}
  )`;

}


/* =========================================================
   DESIGN 1 HEAT
========================================================= */

function drawHeat1(plot,add){
  const heatClip=document.createElement("div");
  heatClip.className="heatClip";
  plot.appendChild(heatClip);

  const reference=
    heatMode==="relative"
      ?add
      :Math.max(
          .25,
          parseFloat(selectedAddInput.value)||.25
        );


  let mm=0;


  while(mm<75){

    let regionPower=0;

    let regionColor=null;

    let next=mm+.25;


    /* FAR */

    if(mm<10){

      regionPower=0;

      next=10;


    /* PROGRESSION */

    }else if(mm<38){

      const currentPower=
        add*
        percent1(mm)/
        100;


      const nextPower=
        Math.floor(
          currentPower/.25+1e-9
        )*.25+.25;


      if(nextPower<=add){

        const boundary=
          mmAtPercent1(
            nextPower/add*100
          );


        if(boundary>mm && boundary<38)
          next=boundary;


        regionPower=nextPower;


      }else{

        regionPower=add;

        next=38;

      }


    /* ADD / NEAR */

    }else{

      const topPower=
        Math.max(
          .25,
          Math.floor(add/.25)*.25
        );


      const topColor=
        heatColor(
          topPower,
          reference
        );


      regionColor=
        darkenColor(
          topColor,
          .0
        );


      next=100;
    }


    const slice=
      document.createElement("div");


    slice.className="heat";


    slice.style.top=
      lensY(mm)+"%";


    slice.style.height=
      h(next-mm)+.2+"%";


    if(regionColor!==null){

      slice.style.background=
        regionColor;

    }else{

      slice.style.background=
        heatColor(
          regionPower,
          reference
        );

    }


heatClip.appendChild(slice);

    mm=next;

  }

}


/* =========================================================
   DESIGN 2 HEAT
========================================================= */

function drawHeat2(plot,add,corridor){
  const heatClip=document.createElement("div");
  heatClip.className="heatClip";
  plot.appendChild(heatClip);

  const reference=
    heatMode==="relative"
      ?add
      :Math.max(
          .25,
          parseFloat(selectedAddInput.value)||.25
        );


  const start=20;

  const end=start+corridor;


  let mm=0;


  while(mm<75){

    let regionPower=0;

    let regionColor=null;

    let next=mm+.25;


    /* FAR */

    if(mm<start){

      regionPower=0;

      next=start;


    /* PROGRESSION */

    }else if(mm<end){

      const currentPower=
        add*
        percent2(mm,corridor)/
        100;


      const nextPower=
        Math.floor(
          currentPower/.25+1e-9
        )*.25+.25;


      if(nextPower<=add){

        const boundary=
          mmAtPercent2(
            nextPower/add*100,
            corridor
          );


        if(boundary>mm && boundary<end)
          next=boundary;


        regionPower=nextPower;


      }else{

        regionPower=add;

        next=end;

      }


    /* ADD / NEAR */

    }else{

      const topPower=
        Math.max(
          .25,
          Math.floor(add/.25)*.25
        );


      const topColor=
        heatColor(
          topPower,
          reference
        );


      regionColor=
        darkenColor(
          topColor,
          .0
        );


      next=100;
    }


    const slice=
      document.createElement("div");


    slice.className="heat";


    slice.style.top=
      lensY(mm)+"%";


    slice.style.height=
      h(next-mm)+.2+"%";


    if(regionColor!==null){

      slice.style.background=
        regionColor;

    }else{

      slice.style.background=
        heatColor(
          regionPower,
          reference
        );

    }


heatClip.appendChild(slice);

    mm=next;

  }

}


/* =========================================================
   LINES
========================================================= */

function addLine(plot,mm,label){

  const line=
    document.createElement("div");


  line.className="line";

  line.style.top=
    lensY(mm)+"%";


  plot.appendChild(line);


  if(label){

    const text=
      document.createElement("div");


    text.className="label";

    text.style.top=
      lensY(mm)+"%";


    text.textContent=
      label;


    plot.appendChild(text);

  }

}


/* =========================================================
   ZONE LABEL
========================================================= */

function addZoneLabel(plot,mm,text){

  const label=
    document.createElement("div");


  label.className="zoneLabel";

  label.style.top=
    lensY(mm)+"%";


  label.textContent=
    text;


  plot.appendChild(label);

}


/* =========================================================
   EYE MARKERS
========================================================= */

function addEyeMarker(plot,mm){

  if(!eyePointVisible)
    return;


  if(mm<0 || mm>50)
    return;


  const eye=
    document.createElement("div");


  eye.className="eyeMarker";


  /*
     Eye marker NEVER moves.

     It is permanently positioned at the
     original 16 mm location.
  */

  eye.style.top=
    y(16)+"%";


  plot.appendChild(eye);

}


function addEyeMarkers(plot){

  if(!eyePointVisible)
    return;


  /*
     Eye Point
  */

  addEyeMarker(
    plot,
    eyePoint
  );


  /*
     Red reference lines:
     16, 18 and 20 mm BELOW Eye Point.

     These remain fixed relative to the
     permanent eye marker.
  */

  [16,18,20].forEach(offset=>{

    const mm=
      eyePoint+offset;


    const line=
      document.createElement("div");


    line.style.position="absolute";
    line.style.left="50%";
    line.style.width="50px";
    line.style.height="3px";

    /*
       Use lensY so the Eye Point movement
       cancels out and these lines remain
       fixed relative to the eye marker.
    */

    line.style.top=
      lensY(mm)+"%";

    line.style.transform="translate(-50%,-50%)";
    line.style.background="rgba(185,74,58,0.7)";
    line.style.pointerEvents="none";
    line.style.zIndex="20";


    plot.appendChild(line);

  });

}


/* =========================================================
   DESIGN 1 MARKERS
========================================================= */

function addMarkers1(plot){

  const c=
    document.createElement("div");


  c.className="cMarker";

  c.style.top=
    lensY(10)+"%";


  plot.appendChild(c);


  const cross=
    document.createElement("div");


  cross.className="crossMarker";

  cross.style.top=
    lensY(20)+"%";


  plot.appendChild(cross);


  const circle=
    document.createElement("div");


  circle.className="completeCircle";

  circle.style.top=
    lensY(42.5)+"%";


  plot.appendChild(circle);


  /*
     Eye Point and red reference lines
  */

  addEyeMarkers(plot);

}


/* =========================================================
   DESIGN 2 MARKERS
========================================================= */

function addMarkers2(plot,corridor){

  /*
     Far circle
  */

  const farCircle=
    document.createElement("div");


  farCircle.className="cMarker";

  farCircle.style.top=
    lensY(16)+"%";


  plot.appendChild(farCircle);


  /*
     Cross at 20 mm
  */

  const cross=
    document.createElement("div");


  cross.className="crossMarker";

  cross.style.top=
    lensY(20)+"%";


  plot.appendChild(cross);


  /*
     Near circle
  */

  const nearStart=
    20+corridor+4.5;


  const nearCircle=
    document.createElement("div");


  nearCircle.className="completeCircle";

  nearCircle.style.top=
    lensY(nearStart)+"%";


  plot.appendChild(nearCircle);


  /*
     Eye Point and red reference lines
  */

  addEyeMarkers(plot);

}


/* =========================================================
   DESIGN 1
========================================================= */

function drawDesign1(far,add){

  const plot=plots[0];


  plot.innerHTML="";


  drawHeat1(
    plot,
    add
  );


  addMarkers1(
    plot
  );


  addLine(
    plot,
    10,
    mode==="add"
      ?"0.00 D"
      :formatPower(far)
  );


  for(
    let power=.25;
    power<add;
    power+=.25
  ){

    const mm=
      mmAtPercent1(
        power/add*100
      );


    addLine(
      plot,
      mm,
      mode==="add"
        ?formatPower(power)
        :formatPower(far+power)
    );

  }


  addLine(
    plot,
    38,
    mode==="add"
      ?formatPower(add)
      :formatPower(far+add)
  );


  addZoneLabel(
    plot,
    10,
    "FAR"
  );


  addZoneLabel(
    plot,
    42.5,
    "NEAR"
  );

}


/* =========================================================
   DESIGN 2
========================================================= */

function drawDesign2(far,add,corridor){

  const plot=plots[1];


  plot.innerHTML="";


  const start=20;

  const end=
    start+corridor;


  drawHeat2(
    plot,
    add,
    corridor
  );


  addMarkers2(
    plot,
    corridor
  );


  addLine(
    plot,
    start,
    mode==="add"
      ?"0.00 D"
      :formatPower(far)
  );


  for(
    let power=.25;
    power<add;
    power+=.25
  ){

    const mm=
      mmAtPercent2(
        power/add*100,
        corridor
      );


    addLine(
      plot,
      mm,
      mode==="add"
        ?formatPower(power)
        :formatPower(far+power)
    );

  }


  addLine(
    plot,
    end,
    mode==="add"
      ?formatPower(add)
      :formatPower(far+add)
  );


  addZoneLabel(
    plot,
    16,
    "FAR"
  );


  addZoneLabel(
    plot,
    end+4.5,
    "NEAR"
  );

}


/* =========================================================
   RULER
========================================================= */

function drawRuler(ruler){

  ruler.innerHTML="";


  for(
    let mm=0;
    mm<=100;
    mm++
  ){

    const tick=
      document.createElement("div");


    tick.className="tick";


    tick.style.top=
      mm+"%";


    if(mm%5===0)
      tick.style.width="15px";


    ruler.appendChild(tick);


    if(mm%5===0){

      const label=
        document.createElement("div");


      label.className="mm";


      label.style.top=
        mm+"%";


      label.textContent=
        mm;


      ruler.appendChild(label);

    }

  }

}


/* =========================================================
   DRAW EVERYTHING
========================================================= */

function draw(){

  const far=
    parseFloat(farInput.value)||0;


  const add=
    Math.max(
      .25,
      parseFloat(addInput.value)||.25
    );


  const corridor=
    parseInt(corridorInput.value);


  drawDesign1(
    far,
    add
  );


  drawDesign2(
    far,
    add,
    corridor
  );

}


/* =========================================================
   ADD / FINAL
========================================================= */

addMode.onclick=()=>{

  mode="add";


  addMode.classList.add("active");

  finalMode.classList.remove("active");


  draw();

};


finalMode.onclick=()=>{

  mode="final";


  finalMode.classList.add("active");

  addMode.classList.remove("active");


  draw();

};


/* =========================================================
   RELATIVE / SELECTED
========================================================= */

relativeMode.onclick=()=>{

  heatMode="relative";


  relativeMode.classList.add("active");

  selectedMode.classList.remove("active");


  draw();

};


selectedMode.onclick=()=>{

  heatMode="selected";


  selectedMode.classList.add("active");

  relativeMode.classList.remove("active");


  draw();

};


/* =========================================================
   INPUT LISTENERS
========================================================= */

farInput.addEventListener(
  "input",
  draw
);


addInput.addEventListener(
  "input",
  draw
);


selectedAddInput.addEventListener(
  "input",
  draw
);


corridorInput.addEventListener(
  "change",
  draw
);


/* =========================================================
   INITIALIZE
========================================================= */

updateEyeControls();


document.getElementById("eyePointToggle")
  .textContent=
    "EYE POINT: "+
    (eyePointVisible?"ON":"OFF");


drawRuler(
  rulers[0]
);


drawRuler(
  rulers[1]
);


draw();

</script>



<script>
let pageScale=.6;

function applyScale(){

  document.querySelector(".app").style.transform=
    `scale(${pageScale})`;

  document.getElementById("scaleValue").value=
    Math.round((pageScale/.6)*100)+"%";

}

function changeScale(amount){

  pageScale+=amount;

  pageScale=Math.max(
    .2,
    Math.min(.9,pageScale)
  );

  applyScale();

}

window.addEventListener("load",applyScale);
</script>
