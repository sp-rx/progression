<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multifocal Power Distribution</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:32px 20px;
  background:#f5f1e8;
  color:#333;
  font-family:Arial,sans-serif;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto
}

h1{
  margin:0 0 20px;
  font-size:22px;
  font-weight:500
}

.panel{
  background:#fffdf7;
  border:1px solid #ddd6c9;
  border-radius:10px;
  padding:16px;
  margin-bottom:12px;
}

.sectionTitle{
  margin:0 0 10px;
  font-size:10px;
  font-weight:600;
  letter-spacing:1.2px;
  color:#777;
}

.panelRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.inputs{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.control{
  display:flex;
  align-items:center;
  gap:7px;
}

.control label{
  font-size:11px;
  color:#666;
}

input,select{
  width:76px;
  height:34px;
  padding:6px 8px;
  border:1px solid #bbb4a8;
  border-radius:5px;
  background:#fff;
  color:#333;
  font-size:14px;
  text-align:center;
}

select{
  width:82px;
  cursor:pointer
}

.unit{
  font-size:12px;
  color:#777
}

.toggle{
  display:flex;
  gap:3px;
  padding:3px;
  background:#eee9df;
  border-radius:6px;
}

.toggle button{
  border:0;
  padding:6px 10px;
  border-radius:4px;
  background:transparent;
  color:#666;
  font-size:10px;
  cursor:pointer;
}

.toggle button.active{
  background:#fffdf7;
  color:#333;
  box-shadow:0 1px 2px rgba(0,0,0,.08);
}


/* EYE CONTROLS */

.eyeControls{
  display:flex;
  gap:18px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #e3ddd2;
}

.eyeControl{
  display:flex;
  align-items:center;
  gap:7px;
}

.eyeControl label{
  font-size:11px;
  color:#666;
}

.eyePointToggle{
  height:34px;
  padding:0 12px;
  border:1px solid #bbb4a8;
  border-radius:6px;
  background:#eee9df;
  color:#555;
  font-size:10px;
  cursor:pointer;
}

.eyePointToggle:hover{
  background:#e3ddd1;
}

.eyePointToggle:active{
  background:#d7d0c3;
}

.eyeButtons{
  display:flex;
  height:34px;
  border:1px solid #bbb4a8;
  border-radius:6px;
  overflow:hidden;
  background:#fff;
}

.eyeButtons button{
  width:34px;
  height:100%;
  border:0;
  background:#eee9df;
  color:#555;
  font-size:17px;
  line-height:1;
  cursor:pointer;
}

.eyeButtons button:hover{
  background:#e3ddd1;
}

.eyeButtons button:active{
  background:#d7d0c3;
}

.eyeValue{
  min-width:48px;
  text-align:center;
  font-size:12px;
  color:#555;
}


/* LENS HEADERS */

.lensTitles{
}

.lensTitle{
  text-align:center;
  font-size:12px;
  letter-spacing:1px;
  color:#555;
}

.design2Title{
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
}

.corridorSelect{
  width:102px;
  height:28px;
  font-size:12px;
  margin-left:10px;
}


/* GRAPHS */

.graphs{
  display:flex;
  justify-content:center;
  gap:120px;
}

.graph{
  display:flex;
  align-items:flex-start
}

.ruler{
  position:relative;
  width:50px;
  height:1200px
}

.mm{
  position:absolute;
  right:10px;
  transform:translateY(-50%);
  font-size:15px;
  color:#777
}

.tick{
  position:absolute;
  right:0;
  width:8px;
  height:1px;
  background:#777
}

.plot{
  position:relative;
  width:680px;
  height:1200px;
  overflow:visible;
  background:#fffdf7;
  border:1px solid #aaa296;
  border-radius:3px;
}

.heat{
  position:absolute;
  left:0;
  width:100%;
  pointer-events:none
}

.heatClip{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
}

.line{
  position:absolute;
  left:0;
  width:100%;
  height:2px;
  background:repeating-linear-gradient(
    to right,
    rgba(60,60,60,.48) 0 3px,
    transparent 3px 7px
  )
}

.label{
  position:absolute;
  left:calc(100% + 10px);
  transform:translateY(-50%);
  white-space:nowrap;
  font-size:15px;
  color:#555
}

.zoneLabel{
  position:absolute;
  left:25%;
  transform:translate(-50%,-50%);
  font-size:15px;
  letter-spacing:1px;
  color:#333;
  background:#fffdf7;
  padding:3px 6px;
  border-radius:3px;
  pointer-events:none
}


/* EXISTING MARKERS */

.cMarker{
  position:absolute;
  left:50%;
  width:100px;
  height:100px;
  transform:translate(-50%,-50%);
  border:2px solid #555;
  border-bottom-color:transparent;
  border-radius:50%;
  pointer-events:none
}

.crossMarker{
  position:absolute;
  left:50%;
  width:15px;
  height:15px;
  transform:translate(-50%,-50%);
  pointer-events:none
}

.crossMarker:before,
.crossMarker:after{
  content:"";
  position:absolute;
  background:#555
}

.crossMarker:before{
  left:50%;
  top:0;
  width:2px;
  height:100%;
  transform:translateX(-50%)
}

.crossMarker:after{
  left:0;
  top:50%;
  width:100%;
  height:2px;
  transform:translateY(-50%)
}

.completeCircle{
  position:absolute;
  left:50%;
  width:96px;
  height:96px;
  transform:translate(-50%,-50%);
  border:2px solid #555;
  border-radius:50%;
  pointer-events:none
}

.circleConnect{
  position:absolute;
  height:2px;
  background:#555;
  transform-origin:left center;
  pointer-events:none;
}

/* EYE POINT */

.eyeMarker{
  position:absolute;
  left:50%;
  width:75px;
  height:75px;
  transform:translate(-50%,-50%);
  border:6px solid rgba(185,74,58,0.7);
  border-radius:50%;
  pointer-events:none;
}


/* STEPPERS */

.stepper{
  display:flex;
  align-items:center;
  height:34px;
  border:1px solid #bbb4a8;
  border-radius:6px;
  overflow:hidden;
  background:#fff
}

.stepper button{
  width:30px;
  height:100%;
  border:0;
  background:#eee9df;
  color:#555;
  font-size:17px;
  line-height:1;
  cursor:pointer;
  transition:.15s
}

.stepper button:hover{
  background:#e3ddd1
}

.stepper button:active{
  background:#d7d0c3
}

.stepper input{
  width:58px;
  height:32px;
  border:0;
  border-left:1px solid #ddd6c9;
  border-right:1px solid #ddd6c9;
  border-radius:0;
  background:#fff;
  outline:none;
}

.stepper input:focus{
  background:#fffdf7
}

.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button{
  -webkit-appearance:none;
  margin:0
}

.stepper input[type=number]{
  -moz-appearance:textfield
}



input[type="range"]{
  width:180px;
  height:6px;
  padding:0;
  border:0;
  background:transparent;
  cursor:pointer;
}

input[type="range"]::-webkit-slider-runnable-track{
  height:4px;
  background:#d8d1c5;
  border-radius:4px;
}

input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:16px;
  height:16px;
  margin-top:-6px;
  border-radius:50%;
  background:#527a64;
  border:2px solid #fffdf7;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}

input[type="range"]::-moz-range-track{
  height:4px;
  background:#d8d1c5;
  border-radius:4px;
}

input[type="range"]::-moz-range-thumb{
  width:16px;
  height:16px;
  border-radius:50%;
  background:#527a64;
  border:2px solid #fffdf7;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}

.sliderValue{
  min-width:55px;
  font-size:12px;
  color:#555;
  text-align:center;
}



</style>
</head>

</div>


</div>

<div

      <button

</div>
</div>

<span id="netFittingHeightValue" class="eyeValue">10 MM</span>

<script>




let fittingHeight=26;

function addFittingHeightLine(plot){

  if(!eyePointVisible)
    return;

  const line=document.createElement("div");

  line.style.position="absolute";
  line.style.left="0";
  line.style.width="100%";
  line.style.height="6px";

  line.style.top=
    (y(16)+(fittingHeight/HEIGHT*100))+"%";

  line.style.transform="translateY(-50%)";

  line.style.background=
    "repeating-linear-gradient(to right,rgba(185,74,58,0.7) 0 4px,transparent 4px 12px)";

  line.style.pointerEvents="none";
  line.style.zIndex="18";

  plot.appendChild(line);
}




function setLensMode(mode){

  lensMode=mode;

  const office=
    document.getElementById("officeLensMode");

  const pal=
    document.getElementById("palLensMode");

  const corridor=
    document.getElementById("corridorControl");


if(mode==="office"){
  office.classList.add("active");
  pal.classList.remove("active");
}else{
  pal.classList.add("active");
  office.classList.remove("active");
}

  draw();

}


document.getElementById("officeLensMode")
  .onclick=function(){

    setLensMode("office");

  };


document.getElementById("palLensMode")
  .onclick=function(){

    setLensMode("pal");

  };



/* =========================================================
   BASIC STEPPER
========================================================= */

function stepInput(id,step){

  const input=document.getElementById(id);

  let value=parseFloat(input.value)||0;

  value=Math.round((value+step)*100)/100;

  if(input.min!=="")
    value=Math.max(parseFloat(input.min),value);

  input.value=value.toFixed(2);

  input.dispatchEvent(
    new Event("input",{bubbles:true})
  );
}


/* =========================================================
   EYE POINT
========================================================= */

/*
   Eye Point is measured in mm from the top
   of the 50 mm lens.

   Starting position:
   Eye Point = 16 mm

   The eye marker itself stays FIXED.

   The lens design moves relative to it.
*/

let eyePoint=20;

let eyePointVisible=true;


/*
   Eye Point:
   -1 = up 1 mm
   +1 = down 1 mm
*/


function toggleEyePoint(){

  eyePointVisible=!eyePointVisible;

  document.getElementById("eyePointToggle")
    .textContent=
      "EYE POINT: "+
      (eyePointVisible?"ON":"OFF");

  draw();

}


function moveEyePoint(amount){

  eyePoint+=amount;

  /*
     Keep the eye point inside the lens.
  */

  eyePoint=Math.max(
    0,
    Math.min(50,eyePoint)
  );

  updateEyeControls();

  draw();

}


function updateEyeControls(){

  const crossPosition=20;

  const span=
    eyePoint-crossPosition;

  document.getElementById("eyePointValue")
    .textContent=
      span.toFixed(0)+" MM";

  updateNetFittingHeight();

}

function updateNetFittingHeight(){

  const eyePoint =
    parseFloat(
      document.getElementById("eyePointValue").textContent
    ) || 0;

  const fittingPosition =
    parseFloat(
      document.getElementById("fittingHeightValue").textContent
    ) || 0;

  const net =
    eyePoint + fittingPosition;

  document.getElementById("netFittingHeightValue")
    .textContent =
      net.toFixed(0)+" MM";
}


/* =========================================================
   INPUTS
========================================================= */

const farInput=
  document.getElementById("far");

const addInput=
  document.getElementById("add");

const selectedAddInput=
  document.getElementById("selectedAdd");

const corridorInput=
  document.getElementById("corridor");


const addMode=
  document.getElementById("addMode");

const finalMode=
  document.getElementById("finalMode");


const relativeMode=
  document.getElementById("relativeMode");

const selectedMode=
  document.getElementById("selectedMode");


const plots=[

  document.getElementById("plot1"),

  document.getElementById("plot2")

];


const rulers=[

  document.getElementById("ruler1"),

  document.getElementById("ruler2")

];

let mode="add";

let heatMode="selected";

let lensMode="office";


const HEIGHT=100;
const OFFSET=25;

function y(mm){
  return (mm+OFFSET)/HEIGHT*100;
}

function h(mm){
  return mm/HEIGHT*100;
}


/* =========================================================
   LENS POSITION
========================================================= */

/*
   The eye marker is permanently fixed at
   the original 16 mm position.

   When Eye Point changes, the entire lens
   design moves in the opposite direction.

   Eye Point 16 mm = original position
   Eye Point 20 mm = lens moves up 4 mm
   Eye Point 12 mm = lens moves down 4 mm
*/

function lensY(mm){

  return y(
    mm-eyePoint+16
  );

}


/* =========================================================
   DESIGN 1
========================================================= */

/*
   10 mm = 0%
   20 mm = 12%
   38 mm = 100%
*/

function percent1(mm){

  if(mm<=10)
    return 0;

  if(mm<=20)
    return (mm-10)/10*12;

  if(mm<=38)
    return 12+(mm-20)/18*88;

  return 100;
}


function mmAtPercent1(p){

  if(p<=12)
    return 10+(p/12)*10;

  return 20+((p-12)/88)*18;

}


/* =========================================================
   DESIGN 2
========================================================= */

function percent2(mm,corridor){

  const start=20;

  const end=start+corridor;

  if(mm<=start)
    return 0;

  if(mm<=end)
    return (mm-start)/corridor*100;

  return 100;
}


function mmAtPercent2(p,corridor){

  return 20+(p/100)*corridor;

}


/* =========================================================
   FORMAT POWER
========================================================= */

function formatPower(v){

  const n=Math.round(v*100)/100;

  return (n>0?"+":"")+n.toFixed(2)+" D";

}


/* =========================================================
   HEAT COLOUR
========================================================= */

function heatColor(power,reference){

  if(power<=0)
    return "#fffdf7";


  const t=Math.max(
    0,
    Math.min(
      1,
      reference>0 ? power/reference : 0
    )
  );


  /*
     WHITE
       ↓
     PALE GREEN
       ↓
     GREEN
       ↓
     YELLOW
       ↓
     ORANGE
       ↓
     RED
  */

const stops=[

  {p:0.00,c:[255,253,247]},  // white
  {p:0.15,c:[250,248,225]},  // very pale yellow
  {p:0.30,c:[246,241,198]},  // pale yellow
  {p:0.45,c:[232,231,180]},  // yellow-green
  {p:0.60,c:[211,222,177]},  // light green
  {p:0.75,c:[190,210,174]},  // soft green
  {p:0.88,c:[173,201,169]},  // pale green
  {p:1.00,c:[158,193,165]}   // light green

];


  let lower=stops[0];
  let upper=stops[stops.length-1];


  for(let i=0;i<stops.length-1;i++){

    if(t>=stops[i].p && t<=stops[i+1].p){

      lower=stops[i];
      upper=stops[i+1];

      break;

    }

  }


  const range=
    upper.p-lower.p;


  const localT=
    range>0
      ?(t-lower.p)/range
      :0;


  const r=
    Math.round(
      lower.c[0]+
      (upper.c[0]-lower.c[0])*localT
    );


  const g=
    Math.round(
      lower.c[1]+
      (upper.c[1]-lower.c[1])*localT
    );


  const b=
    Math.round(
      lower.c[2]+
      (upper.c[2]-lower.c[2])*localT
    );


  return `rgb(${r},${g},${b})`;

}

/* =========================================================
   DARKEN
========================================================= */

function darkenColor(color,amount=.25){

  const match=color.match(/\d+/g);

  if(!match)
    return color;


  const r=parseInt(match[0]);

  const g=parseInt(match[1]);

  const b=parseInt(match[2]);


  return `rgb(
    ${Math.round(r*(1-amount))},
    ${Math.round(g*(1-amount))},
    ${Math.round(b*(1-amount))}
  )`;

}


/* =========================================================
   DESIGN 1 HEAT
========================================================= */

function drawHeat1(plot,add){
  const heatClip=document.createElement("div");
  heatClip.className="heatClip";
  plot.appendChild(heatClip);

  const reference=
    heatMode==="relative"
      ?add
      :Math.max(
          .25,
  (parseFloat(selectedAddInput.value)||.25)+.25
        );


  let mm=0;


  while(mm<75){

    let regionPower=0;

    let regionColor=null;

    let next=mm+.25;


    /* FAR */

    if(mm<10){

      regionPower=0;

      next=10;


    /* PROGRESSION */

    }else if(mm<38){

      const currentPower=
        add*
        percent1(mm)/
        100;


      const nextPower=
        Math.floor(
          currentPower/.25+1e-9
        )*.25+.25;


      if(nextPower<=add){

        const boundary=
          mmAtPercent1(
            nextPower/add*100
          );


        if(boundary>mm && boundary<38)
          next=boundary;


        regionPower=nextPower;


      }else{

        regionPower=add;

        next=38;

      }


    /* ADD / NEAR */

    }else{

const topPower=
  Math.min(
    reference,
    Math.floor(add/.25)*.25 + .25
  );


      const topColor=
        heatColor(
          topPower,
          reference
        );


      regionColor=
        darkenColor(
          topColor,
          .0
        );


      next=100;
    }


    const slice=
      document.createElement("div");


    slice.className="heat";


    slice.style.top=
      lensY(mm)+"%";


    slice.style.height=
      h(next-mm)+.2+"%";


    if(regionColor!==null){

      slice.style.background=
        regionColor;

    }else{

      slice.style.background=
        heatColor(
          regionPower,
          reference
        );

    }


heatClip.appendChild(slice);

    mm=next;

  }

}


/* =========================================================
   DESIGN 2 HEAT
========================================================= */

function drawHeat2(plot,add,corridor){
  const heatClip=document.createElement("div");
  heatClip.className="heatClip";
  plot.appendChild(heatClip);

  const reference=
    heatMode==="relative"
      ?add
      :Math.max(
          .25,
  (parseFloat(selectedAddInput.value)||.25)+.25
        );


  const start=20;

  const end=start+corridor;


  let mm=0;


  while(mm<75){

    let regionPower=0;

    let regionColor=null;

    let next=mm+.25;


    /* FAR */

    if(mm<start){

      regionPower=0;

      next=start;


    /* PROGRESSION */

    }else if(mm<end){

      const currentPower=
        add*
        percent2(mm,corridor)/
        100;


      const nextPower=
        Math.floor(
          currentPower/.25+1e-9
        )*.25+.25;


      if(nextPower<=add){

        const boundary=
          mmAtPercent2(
            nextPower/add*100,
            corridor
          );


        if(boundary>mm && boundary<end)
          next=boundary;


        regionPower=nextPower;


      }else{

        regionPower=add;

        next=end;

      }


    /* ADD / NEAR */

    }else{

const topPower=
  Math.min(
    reference,
    Math.floor(add/.25)*.25 + .25
  );


      const topColor=
        heatColor(
          topPower,
          reference
        );


      regionColor=
        darkenColor(
          topColor,
          .0
        );


      next=100;
    }


    const slice=
      document.createElement("div");


    slice.className="heat";


    slice.style.top=
      lensY(mm)+"%";


    slice.style.height=
      h(next-mm)+.2+"%";


    if(regionColor!==null){

      slice.style.background=
        regionColor;

    }else{

      slice.style.background=
        heatColor(
          regionPower,
          reference
        );

    }


heatClip.appendChild(slice);

    mm=next;

  }

}


/* =========================================================
   LINES
========================================================= */

function addLine(plot,mm,label){

  const line=
    document.createElement("div");


  line.className="line";

  line.style.top=
    lensY(mm)+"%";


  plot.appendChild(line);


  if(label){

    const text=
      document.createElement("div");


    text.className="label";

    text.style.top=
      lensY(mm)+"%";


    text.textContent=
      label;


    plot.appendChild(text);

  }

}


/* =========================================================
   ZONE LABEL
========================================================= */

function addZoneLabel(plot,mm,text){

  const label=
    document.createElement("div");


  label.className="zoneLabel";

  label.style.top=
    lensY(mm)+"%";


  label.textContent=
    text;


  plot.appendChild(label);

}


/* =========================================================
   EYE MARKERS
========================================================= */

function addEyeMarker(plot,mm){

  if(!eyePointVisible)
    return;


  if(mm<0 || mm>50)
    return;


  const eye=
    document.createElement("div");


  eye.className="eyeMarker";


  /*
     Eye marker NEVER moves.

     It is permanently positioned at the
     original 16 mm location.
  */

  eye.style.top=
    y(16)+"%";


  plot.appendChild(eye);

}


function addEyeMarkers(plot){

  if(!eyePointVisible)
    return;


  /*
     Eye Point
  */

  addEyeMarker(
    plot,
    eyePoint
  );


  /*
     Red reference lines:
     16, 18 and 20 mm BELOW Eye Point.

     These remain fixed relative to the
     permanent eye marker.
  */

[16,18,20].forEach(offset=>{

  const mm = eyePoint + offset;

  const lineLeft = document.createElement("div");

  lineLeft.style.position = "absolute";
  lineLeft.style.left = "calc(50% - 54px)";
  lineLeft.style.width = "48px";
  lineLeft.style.height = "3px";
  lineLeft.style.top = lensY(mm) + "%";
  lineLeft.style.background = "rgba(185,74,58,0.7)";
  lineLeft.style.pointerEvents = "none";
  lineLeft.style.zIndex = "20";

  plot.appendChild(lineLeft);


  const lineRight = document.createElement("div");

  lineRight.style.position = "absolute";
  lineRight.style.left = "calc(50% + 6px)";
  lineRight.style.width = "48px";
  lineRight.style.height = "3px";
  lineRight.style.top = lensY(mm) + "%";
  lineRight.style.background = "rgba(185,74,58,0.7)";
  lineRight.style.pointerEvents = "none";
  lineRight.style.zIndex = "20";

  plot.appendChild(lineRight);

});

}


/* =========================================================
   COMPLETE CIRCLE OFFSET
========================================================= */




function addCompleteCircleConnection(
  plot,
  circleMM,
  crossMM
){

  const line=
    document.createElement("div");

  line.className="circleConnect";

  /*
     Circle center
  */

  const circleX=
    50+circleOffsetX();

  const circleY=
    lensY(circleMM);


  /*
     Cross center
  */

  const crossX=50;

  const crossY=
    lensY(crossMM);


  /*
     Convert percentage coordinates
     into the actual plot dimensions.
  */

  const dx=
    (crossX-circleX)*
    plot.clientWidth/
    100;

  const dy=
    (crossY-circleY)*
    plot.clientHeight/
    100;


  const length=
    Math.sqrt(
      dx*dx+
      dy*dy
    );


  const angle=
    Math.atan2(dy,dx)*
    180/Math.PI;


  line.style.left=
    circleX+"%";

  line.style.top=
    circleY+"%";

  line.style.width=
    length+"px";

  line.style.transform=
    `rotate(${angle}deg)`;


  plot.appendChild(line);

}


/* =========================================================
   DESIGN 1 MARKERS
========================================================= */

function addMarkers1(plot,plotIndex){

  const c=
    document.createElement("div");


  c.className="cMarker";

  c.style.top=
    lensY(10)+"%";


  plot.appendChild(c);


  const cross=
    document.createElement("div");


  cross.className="crossMarker";

  cross.style.top=
    lensY(20)+"%";


  plot.appendChild(cross);


  const circle=
    document.createElement("div");


  circle.className="completeCircle";

  circle.style.top=
    lensY(42.5)+"%";

circle.style.left=
  `calc(50% + ${plotIndex===0?30.6:-30.6}px)`;



  /*
     Connect the CENTER of the circle
     to the CENTER of the cross.
  */


plot.appendChild(circle);

addFittingHeightLine(plot);

addEyeMarkers(plot);

}

/* =========================================================
   DESIGN 2 MARKERS
========================================================= */

function addMarkers2(plot,corridor,plotIndex){

  const farCircle=
    document.createElement("div");


  farCircle.className="cMarker";

  farCircle.style.top=
    lensY(16)+"%";


  plot.appendChild(farCircle);


  const cross=
    document.createElement("div");


  cross.className="crossMarker";

  cross.style.top=
    lensY(20)+"%";


  plot.appendChild(cross);


  const nearStart=
    20+corridor+4.5;


  const nearCircle=
    document.createElement("div");


  nearCircle.className="completeCircle";

  nearCircle.style.top=
    lensY(nearStart)+"%";

nearCircle.style.left=
  `calc(50% + ${plotIndex===0?30.6:-30.6}px)`;



  /*
     Connect the CENTER of the circle
     to the CENTER of the cross.
  */


plot.appendChild(nearCircle);

addFittingHeightLine(plot);

addEyeMarkers(plot);

}

/* =========================================================
   DESIGN 1
========================================================= */


function drawDesign1(far,add,plotIndex=0){

  const plot=plots[plotIndex];


  plot.innerHTML="";


  drawHeat1(
    plot,
    add
  );


addMarkers1(
  plot,
  plotIndex
);


  addLine(
    plot,
    10,
    mode==="add"
      ?"0.00 D"
      :formatPower(far)
  );


  for(
    let power=.25;
    power<add;
    power+=.25
  ){

    const mm=
      mmAtPercent1(
        power/add*100
      );


    addLine(
      plot,
      mm,
      mode==="add"
        ?formatPower(power)
        :formatPower(far+power)
    );

  }


  addLine(
    plot,
    38,
    mode==="add"
      ?formatPower(add)
      :formatPower(far+add)
  );


  addZoneLabel(
    plot,
    10,
    "FAR"
  );


  addZoneLabel(
    plot,
    42.5,
    "NEAR"
  );

}


/* =========================================================
   DESIGN 2
========================================================= */


function drawDesign2(far,add,corridor,plotIndex=0){

  const plot=plots[plotIndex];


  plot.innerHTML="";


  const start=20;

  const end=
    start+corridor;


  drawHeat2(
    plot,
    add,
    corridor
  );


addMarkers2(
  plot,
  corridor,
  plotIndex
);


  addLine(
    plot,
    start,
    mode==="add"
      ?"0.00 D"
      :formatPower(far)
  );


  for(
    let power=.25;
    power<add;
    power+=.25
  ){

    const mm=
      mmAtPercent2(
        power/add*100,
        corridor
      );


    addLine(
      plot,
      mm,
      mode==="add"
        ?formatPower(power)
        :formatPower(far+power)
    );

  }


  addLine(
    plot,
    end,
    mode==="add"
      ?formatPower(add)
      :formatPower(far+add)
  );


  addZoneLabel(
    plot,
    16,
    "FAR"
  );


  addZoneLabel(
    plot,
    end+4.5,
    "NEAR"
  );

}


/* =========================================================
   RULER
========================================================= */

function drawRuler(ruler){

  ruler.innerHTML="";


  for(
    let mm=0;
    mm<=100;
    mm++
  ){

    const tick=
      document.createElement("div");


    tick.className="tick";


    tick.style.top=
      mm+"%";


    if(mm%5===0)
      tick.style.width="15px";


    ruler.appendChild(tick);


    if(mm%5===0){

      const label=
        document.createElement("div");


      label.className="mm";


      label.style.top=
        mm+"%";


      label.textContent=
        mm;


      ruler.appendChild(label);

    }

  }

}


/* =========================================================
   DRAW EVERYTHING
========================================================= */

function draw(){

  const far=
    parseFloat(farInput.value)||0;

  const add=
    Math.max(
      .25,
      parseFloat(addInput.value)||.25
    );

  const corridor=
    parseInt(corridorInput.value);

  if(lensMode==="office"){

    drawDesign1(
      far,
      add,
      0
    );

    drawDesign1(
      far,
      add,
      1
    );

  }else{

    drawDesign2(
      far,
      add,
      corridor,
      0
    );

    drawDesign2(
      far,
      add,
      corridor,
      1
    );

  }

}


/* =========================================================
   ADD / FINAL
========================================================= */

addMode.onclick=()=>{

  mode="add";


  addMode.classList.add("active");

  finalMode.classList.remove("active");


  draw();

};


finalMode.onclick=()=>{

  mode="final";


  finalMode.classList.add("active");

  addMode.classList.remove("active");


  draw();

};


/* =========================================================
   RELATIVE / SELECTED
========================================================= */

relativeMode.onclick=()=>{

  heatMode="relative";


  relativeMode.classList.add("active");

  selectedMode.classList.remove("active");


  draw();

};


selectedMode.onclick=()=>{

  heatMode="selected";


  selectedMode.classList.add("active");

  relativeMode.classList.remove("active");


  draw();

};


/* =========================================================
   INPUT LISTENERS
========================================================= */

farInput.addEventListener(
  "input",
  draw
);


addInput.addEventListener(
  "input",
  draw
);


selectedAddInput.addEventListener(
  "input",
  draw
);


corridorInput.addEventListener(
  "change",
  draw
);


/* =========================================================
   INITIALIZE
========================================================= */

updateEyeControls();


document.getElementById("eyePointToggle")
  .textContent=
    "EYE POINT: "+
    (eyePointVisible?"ON":"OFF");


drawRuler(
  rulers[0]
);


drawRuler(
  rulers[1]
);


draw();

</script>



<script>
let pageScale=.68;

function applyScale(){

  document.querySelector(".app").style.transform=
    `scale(${pageScale})`;

  document.getElementById("scaleValue").value=
    Math.round((pageScale/.68)*100)+"%";

}

function changeScale(amount){

  pageScale+=amount;

  pageScale=Math.max(
    .2,
    Math.min(.9,pageScale)
  );

  applyScale();

}

window.addEventListener("load",applyScale);
</script>

document.getElementById("fittingHeight")
  .addEventListener("input",function(){

    fittingHeight=
      parseFloat(this.value);

    document.getElementById("fittingHeightValue")
      .textContent=
        fittingHeight+" MM";

    updateNetFittingHeight();

    draw();

  });
</script>
